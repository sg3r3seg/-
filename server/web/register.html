<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveX — Create account</title><link rel="icon" href="/img/icon.svg"><link rel="stylesheet" href="/css/site.css"><script src="/js/site.js" defer></script></head>
<body data-page="register">
<header class="top"><a class="brand" href="/index.html"><span class="logo">X</span>LIVEX</a>
<nav class="links"><a href="/index.html#pricing" data-i18n="nav_pricing"></a>
<a href="/account.html" data-auth="in" class="hidden" data-i18n="nav_account"></a>
<a href="#" id="logoutLink" data-auth="in" class="hidden" data-i18n="nav_logout"></a>
<a href="/login.html" data-auth="out" data-i18n="nav_login"></a>
<a href="/register.html" data-auth="out" class="btn primary" data-i18n="nav_register"></a>
<button class="lang" id="langBtn">עברית</button></nav></header>
<main class="wrap">

<div class="card auth"><h2 data-i18n="create_account"></h2>
<form id="registerForm" autocomplete="on"><div class="row2"><div><label data-i18n="first_name"></label><input name="firstName" required maxlength="60" autocomplete="given-name"></div>
<div><label data-i18n="last_name"></label><input name="lastName" required maxlength="60" autocomplete="family-name"></div></div>
<label data-i18n="email"></label><input name="email" type="email" required autocomplete="email">
<label data-i18n="password"></label><input name="password" type="password" required minlength="8" autocomplete="new-password"><div class="muted" style="font-size:12px;margin-top:6px" data-i18n="password_hint"></div>
<p><button class="btn primary" type="submit" style="width:100%" data-i18n="create_account"></button></p><div class="msg"></div></form>
<p class="muted"><span data-i18n="have_account"></span> <a href="/login.html" data-i18n="sign_in"></a></p></div>
</main>
<footer>© LiveX — ONE PLATFORM. EVERY CREATOR.</footer>
</body></html>
