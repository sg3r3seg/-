<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveX — Sign in</title><link rel="icon" href="/img/icon.svg"><link rel="stylesheet" href="/css/site.css"><script src="/js/site.js" defer></script></head>
<body data-page="login">

<a href="/login.html" data-auth="out" data-i18n="nav_login"></a>

<p><a href="/forgot.html" data-i18n="forgot"></a></p><p class="muted"><span data-i18n="no_account"></span> <a href="/register.html" data-i18n="create_account"></a></p></div>
</main>
<footer>© LiveX — ONE PLATFORM. EVERY CREATOR.</footer>
