name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.13' }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.13' }
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
  windows-installer:
    runs-on: windows-latest
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.13' }
      - run: choco install nsis -y
      - run: npm ci
        working-directory: app
      - run: node scripts/build-installer.js
        working-directory: app
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LiveX-Setup
          path: app/release/LiveX-Setup-*.exe
  release:
    # Publishes the Windows installer built above as a GitHub pre-release.
    # Runs on manual dispatch or when the commit message contains [release].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    needs: [windows-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LiveX-Setup
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v${VERSION}-preview"
          FILE="dist/LiveX-Setup-${VERSION}.exe"
          SRV="dist/LiveX-Test-Server.zip"
          git archive --format=zip -o "$SRV" HEAD:server   # server code only; keys are never committed
          (cd dist && sha256sum "LiveX-Setup-${VERSION}.exe" LiveX-Test-Server.zip | tee SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$SRV" dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$FILE" "$SRV" dist/SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" \
              --title "LiveX ${VERSION} — Preview (test build)" --notes-file .github/release-notes.md
          fi
